# =============================================================
# 拦截常见自动化扫描器探测，静默断开 (444)，不写入 access.log
# 部署路径：/etc/nginx/snippets/block_malicious.conf
# =============================================================

location ~* \.(php|env|git|htaccess|bak|yml|yaml|ini|sql|sh)$ {
    return 444;
    access_log off;
}

location ~* /(wp-|wordpress|phpmyadmin|adminer|actuator|xmlrpc\.php) {
    return 444;
    access_log off;
}
